seed: 42
test_size: 0.30
cv_folds: 5

paths:
  raw_csv: data/raw/ObesityDataSet_raw_and_data_sinthetic.csv
  clean_csv: data/processed/obesity_clean.csv
  split_indices: data/processed/split_indices.json
  models_dir: models
  figures_dir: reports/figures
  tables_dir: reports/tables
  private_dir: reports/private  # resultats gardes en prive (non versionnes)

# Modeles entraines et suivis dans MLflow, mais dont les resultats ne sont pas publies
private_models: [KNN, LogisticRegression, OrdinalLogReg]

uci_id: 544

target: NObeyesdad
weight_col: Weight
height_col: Height

columns:
  binary: [family_history_with_overweight, FAVC, SMOKE, SCC]
  ordinal_text: [CAEC, CALC]
  ordinal_order: ["no", Sometimes, Frequently, Always]  # "no" entre guillemets (sinon booleen YAML)
  nominal: [Gender, MTRANS]
  numeric: [Age, FCVC, NCP, CH2O, FAF, TUE]
  ordinal_numeric: [FCVC, NCP, CH2O, FAF, TUE]

# Modalites rares a fusionner (voir docs/DECISIONS.md)
rare_merge:
  CALC: {Always: Frequently}

class_order:
  - Insufficient_Weight
  - Normal_Weight
  - Overweight_Level_I
  - Overweight_Level_II
  - Obesity_Type_I
  - Obesity_Type_II
  - Obesity_Type_III

# Bornes IMC [min inclus, max exclu[ : seuils OMS (18.5/25/30/35/40) ; coupure Overweight I/II = 26.9,
# optimale sur le train (voir docs/DECISIONS.md)
bmi_thresholds:
  Insufficient_Weight: [0, 18.5]
  Normal_Weight: [18.5, 25.0]
  Overweight_Level_I: [25.0, 26.9]
  Overweight_Level_II: [26.9, 30.0]
  Obesity_Type_I: [30.0, 35.0]
  Obesity_Type_II: [35.0, 40.0]
  Obesity_Type_III: [40.0, 100.0]

mlflow:
  tracking_uri: sqlite:///mlflow.db
  clf_experiment: obesity-classification
  reg_experiment: obesity-regression
  clf_model_name: obesity-classifier
  reg_model_name: obesity-weight-regressor
