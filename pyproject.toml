[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obesity-levels"
version = "0.1.0"
description = "Data Mining M1 - classification multiclasse et regression lineaire des niveaux d'obesite, avec MLOps leger"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.14",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "jupyter>=1.0", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
